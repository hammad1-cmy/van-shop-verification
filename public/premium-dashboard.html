<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Shah Oil Traders - Executive Dashboard</title>
<style>
  :root {
    --petronas-teal: #00A19A;
    --petronas-teal-dark: #007A73;
    --petronas-teal-darkest: #003D3A;
    --petronas-gold: #FDB714;
    --petronas-gold-dark: #C98A0A;
    --bg: #041615;
    --panel: #0A2523;
    --panel2: #0F332F;
    --border: #164A44;
    --text: #EAF7F5;
    --muted: #8FB8B3;
    --danger: #FF6B5E;
    --radius: 12px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
  }

  /* ---------- HERO: 3D falling bottles ---------- */
  #hero {
    position: relative;
    height: 100vh;
    min-height: 520px;
    max-height: 820px;
    width: 100%;
    overflow: hidden;
    background: radial-gradient(ellipse at 50% 20%, #0d3d38 0%, #041615 70%);
  }
  .bottle-bg { position: absolute; inset: 0; overflow: hidden; }
  .bg-bottle { position: absolute; width: 150px; filter: drop-shadow(0 20px 30px rgba(0,0,0,0.5)); animation: floatY 6s ease-in-out infinite; }
  .b1 { bottom: 5%; left: 6%; width: 170px; animation-delay: 0s; }
  .b2 { bottom: 8%; left: 30%; width: 140px; animation-delay: 1.2s; transform: rotate(-8deg); }
  .b3 { bottom: 4%; left: 55%; width: 160px; animation-delay: 0.6s; transform: rotate(6deg); }
  .b4 { bottom: 10%; left: 76%; width: 130px; animation-delay: 1.8s; transform: rotate(-4deg); }
  .b5 { bottom: 2%; left: 90%; width: 120px; animation-delay: 0.3s; display: none; }
  @keyframes floatY { 0%,100% { transform: translateY(0) rotate(var(--r,0deg)); } 50% { transform: translateY(-16px) rotate(var(--r,0deg)); } }
  @media (min-width: 900px) { .b5 { display: block; } }
  #heroOverlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    padding-top: 8vh;
    pointer-events: none;
    text-align: center;
  }
  #heroOverlay h1 {
    font-size: clamp(32px, 6vw, 72px);
    margin: 0;
    font-weight: 800;
    letter-spacing: 1px;
    color: #fff;
    text-shadow: 0 0 30px rgba(0,161,154,0.8), 0 2px 6px rgba(0,0,0,0.6);
  }
  #heroOverlay .sub {
    margin-top: 10px;
    font-size: clamp(13px, 1.6vw, 18px);
    color: var(--petronas-gold);
    font-weight: 600;
    letter-spacing: 3px;
    text-transform: uppercase;
  }
  #scrollHint {
    position: absolute;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%);
    color: var(--muted);
    font-size: 13px;
    animation: bob 1.8s ease-in-out infinite;
  }
  @keyframes bob { 0%,100% { transform: translate(-50%, 0); } 50% { transform: translate(-50%, 8px); } }

  /* ---------- DASHBOARD ---------- */
  #dash { max-width: 1300px; margin: 0 auto; padding: 24px 20px 80px; }
  .dash-header { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 20px; }
  .dash-header h2 { margin: 0; font-size: 24px; }
  .badge-live {
    font-size: 11px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase;
    color: var(--petronas-teal-darkest); background: var(--petronas-gold);
    padding: 3px 10px; border-radius: 999px;
  }
  .spacer { flex: 1; }

  .filters {
    display: flex; gap: 10px; flex-wrap: wrap; align-items: center;
    background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 14px; margin-bottom: 20px;
  }
  .filters select, .filters input {
    background: var(--panel2); border: 1px solid var(--border); color: var(--text);
    padding: 9px 12px; border-radius: 8px; font-size: 14px;
  }
  .filters input[type="search"] { min-width: 220px; flex: 1; }

  .stat-tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px,1fr)); gap: 14px; margin-bottom: 20px; }
  .stat-tile {
    background: linear-gradient(145deg, var(--panel), var(--panel2));
    border: 1px solid var(--border); border-radius: var(--radius); padding: 18px;
    position: relative; overflow: hidden;
  }
  .stat-tile::before {
    content: ''; position: absolute; top: -30%; right: -20%; width: 120px; height: 120px;
    background: radial-gradient(circle, rgba(0,161,154,0.35), transparent 70%);
  }
  .stat-value { font-size: 28px; font-weight: 800; color: #fff; }
  .stat-label { font-size: 12px; color: var(--muted); margin-top: 6px; }
  .stat-tile.gold .stat-value { color: var(--petronas-gold); }

  .chart-card, .table-card {
    background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 18px; margin-bottom: 20px;
  }
  .chart-card h3, .table-card h3 { margin: 0 0 14px; font-size: 16px; }
  .bar-row { display: grid; grid-template-columns: 130px 1fr 90px; align-items: center; gap: 10px; margin-bottom: 9px; font-size: 13px; }
  .bar-label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--muted); }
  .bar-track { background: var(--panel2); border-radius: 5px; height: 18px; overflow: hidden; border: 1px solid var(--border); }
  .bar-fill { height: 100%; background: linear-gradient(90deg, var(--petronas-teal-dark), var(--petronas-teal), var(--petronas-gold)); }
  .bar-value { text-align: right; font-variant-numeric: tabular-nums; color: #fff; }
  .chart-empty { color: var(--muted); font-size: 13px; }

  table.shops-table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
  table.shops-table th {
    text-align: left; padding: 10px 12px; color: var(--petronas-gold); font-size: 11px;
    text-transform: uppercase; letter-spacing: 0.5px; border-bottom: 2px solid var(--border); white-space: nowrap;
  }
  table.shops-table td { padding: 10px 12px; border-bottom: 1px solid var(--border); white-space: nowrap; }
  table.shops-table tbody tr { cursor: pointer; transition: background 0.15s; }
  table.shops-table tbody tr:hover { background: var(--panel2); }
  .diff-ok { color: #4ADE80; font-weight: 600; }
  .diff-mismatch { color: var(--danger); font-weight: 700; }
  .muted { color: var(--muted); }
  .empty-state { text-align: center; padding: 40px; color: var(--muted); }

  /* ---------- MODAL ---------- */
  .modal-backdrop {
    position: fixed; inset: 0; background: rgba(2,10,9,0.85); backdrop-filter: blur(4px);
    display: flex; align-items: center; justify-content: center; z-index: 300; padding: 20px;
  }
  .modal-backdrop.hidden { display: none; }
  .modal {
    background: var(--panel); border: 1px solid var(--border); border-radius: 16px;
    max-width: 760px; width: 100%; max-height: 88vh; overflow-y: auto; padding: 26px;
    box-shadow: 0 0 60px rgba(0,161,154,0.25);
  }
  .modal-head { display: flex; align-items: center; gap: 12px; margin-bottom: 18px; }
  .modal-head h2 { margin: 0; font-size: 22px; }
  .modal-close {
    margin-left: auto; background: var(--panel2); border: 1px solid var(--border); color: var(--text);
    width: 34px; height: 34px; border-radius: 8px; cursor: pointer; font-size: 18px;
  }
  .modal-close:hover { border-color: var(--danger); color: var(--danger); }
  .detail-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 20px; }
  .detail-field { background: var(--panel2); border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; }
  .detail-field label { display: block; font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 4px; }
  .detail-field .val { font-size: 15px; font-weight: 600; word-break: break-word; }
  .detail-field.wide { grid-column: 1 / -1; }
  .detail-field.diff .val.diff-ok { color: #4ADE80; }
  .detail-field.diff .val.diff-mismatch { color: var(--danger); }

  .photo-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px,1fr)); gap: 10px; }
  .photo-thumb { aspect-ratio: 1; border-radius: 8px; overflow: hidden; border: 1px solid var(--border); cursor: zoom-in; }
  .photo-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .no-photos { color: var(--muted); font-size: 13px; }

  /* lightbox reused for modal photos */
  .lightbox { position: fixed; inset: 0; background: rgba(0,0,0,0.94); z-index: 400; display: flex; align-items: center; justify-content: center; }
  .lightbox.hidden { display: none; }
  .lightbox img { max-width: 92vw; max-height: 88vh; object-fit: contain; border-radius: 6px; }
  .lb-close { position: absolute; top: 16px; right: 20px; background: rgba(255,255,255,0.12); color: #fff; border: none; border-radius: 8px; width: 44px; height: 44px; font-size: 24px; cursor: pointer; }
  .lb-nav { position: absolute; top: 50%; transform: translateY(-50%); background: rgba(255,255,255,0.12); color: #fff; border: none; border-radius: 50%; width: 50px; height: 50px; font-size: 30px; cursor: pointer; }
  .lb-prev { left: 16px; } .lb-next { right: 16px; }
  .lb-counter { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); color: rgba(255,255,255,0.8); font-size: 13px; background: rgba(0,0,0,0.5); padding: 4px 12px; border-radius: 999px; }

  #loadingToast {
    position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
    background: var(--panel2); border: 1px solid var(--border); padding: 10px 18px; border-radius: 999px;
    font-size: 13px; z-index: 200; opacity: 0; transition: opacity 0.2s; pointer-events: none;
  }
  #loadingToast.show { opacity: 1; }
  #loadingToast.err { border-color: var(--danger); color: var(--danger); }

  @media (max-width: 640px) {
    .detail-grid { grid-template-columns: 1fr; }
    .filters input[type="search"] { min-width: 0; width: 100%; }
  }
</style>
</head>
<body>

<section id="hero">
  <div class="bottle-bg">
    <img src="assets/bottle-hybrid.png" class="bg-bottle b1" />
    <img src="assets/bottle-5000.png" class="bg-bottle b2" />
    <img src="assets/bottle-800.png" class="bg-bottle b3" />
    <img src="assets/bottle-hybrid.png" class="bg-bottle b4" />
    <img src="assets/bottle-5000.png" class="bg-bottle b5" />
  </div>
  <div id="heroOverlay">
    <h1>SHAH OIL TRADERS</h1>
    <div class="sub">Authorized PETRONAS Lubricants Distributor</div>
  </div>
  <div id="scrollHint">&#9660; Scroll for live verification dashboard</div>
</section>

<main id="dash">
  <div class="dash-header">
    <h2>Verification Overview</h2>
    <span class="badge-live" id="liveBadge">Loading...</span>
    <div class="spacer"></div>
  </div>

  <div class="filters">
    <select id="fVan">
      <option value="">All Vans</option>
      <option value="1">Van 1</option><option value="2">Van 2</option><option value="3">Van 3</option>
      <option value="4">Van 4</option><option value="5">Van 5</option>
    </select>
    <select id="fDay">
      <option value="">All Days</option>
      <option value="1">Day 1</option><option value="2">Day 2</option><option value="3">Day 3</option>
      <option value="4">Day 4</option><option value="5">Day 5</option><option value="6">Day 6</option><option value="7">Day 7</option>
    </select>
    <select id="fSort">
      <option value="default">Sort: Van &amp; Day</option>
      <option value="balance_desc">Balance: High &rarr; Low</option>
      <option value="balance_asc">Balance: Low &rarr; High</option>
      <option value="diff_desc">Biggest Difference First</option>
      <option value="code">Customer Code A&ndash;Z</option>
      <option value="photos_desc">Most Photos First</option>
    </select>
    <input id="fSearch" type="search" placeholder="Search customer code or name..." />
  </div>

  <div id="filterBanner" style="display:none;background:var(--petronas-gold);color:#042;padding:10px 16px;border-radius:8px;margin-bottom:14px;font-weight:600"></div>
  <div class="stat-tiles" id="statTiles"></div>

  <div class="chart-card">
    <h3>Balance by Shop <span class="muted" id="chartScope"></span></h3>
    <div id="chart"></div>
  </div>

  <div class="table-card">
    <h3>Shops <span class="muted" id="tableCount"></span></h3>
    <div style="overflow-x:auto">
      <table class="shops-table">
        <thead>
          <tr>
            <th>Van</th><th>Day</th><th>Customer Code</th><th>Customer Name</th>
            <th>Company Bal.</th><th>Customer Bal.</th><th>Difference</th><th>Photos</th><th>Visit Date</th>
          </tr>
        </thead>
        <tbody id="tableBody"></tbody>
      </table>
      <div id="emptyState" class="empty-state" style="display:none">No shops match these filters.</div>
    </div>
  </div>
</main>

<!-- Shop detail modal -->
<div id="modalBackdrop" class="modal-backdrop hidden">
  <div class="modal">
    <div class="modal-head">
      <h2 id="modalTitle">Shop</h2>
      <button class="modal-close" id="modalClose">&times;</button>
    </div>
    <div class="detail-grid" id="modalFields"></div>
    <h3 style="margin:0 0 12px">Photos</h3>
    <div class="photo-grid" id="modalPhotos"></div>
  </div>
</div>

<div id="lightbox" class="lightbox hidden">
  <button class="lb-close" id="lbClose">&times;</button>
  <button class="lb-nav lb-prev" id="lbPrev">&#8249;</button>
  <img id="lbImage" alt="Shop photo" />
  <button class="lb-nav lb-next" id="lbNext">&#8250;</button>
  <div class="lb-counter" id="lbCounter"></div>
</div>

<div id="loadingToast"></div>

<script>
// =========================================================================
// PART 2 - Live, accurate dashboard (reads the same API as the main site)
// =========================================================================
const el = (sel) => document.querySelector(sel);
let allShops = [];
const state = { onlyMismatches: false, onlyVerified: false };

function toast(msg, type) {
  const t = el('#loadingToast');
  t.textContent = msg;
  t.className = 'show' + (type ? ' ' + type : '');
  clearTimeout(toast._t);
  toast._t = setTimeout(() => (t.className = ''), 2500);
}

async function api(url, opts) {
  const res = await fetch(url, opts);
  if (res.status === 401) {
    window.location.href = '/login.html';
    return new Promise(() => {});
  }
  if (!res.ok) {
    const data = await res.json().catch(() => null);
    throw new Error((data && data.error) || `Request failed (${res.status})`);
  }
  return res.json();
}

// Same parsing/computation rules as the main site's form and Excel export -
// this dashboard must never show a number that disagrees with them.
function parseMoney(v) {
  const n = parseFloat(String(v || '').replace(/[^0-9.-]/g, ''));
  return Number.isFinite(n) ? n : null;
}
function balanceValue(s) { return parseMoney(s.balance_customer); }
function differenceValue(s) {
  const c = parseMoney(s.balance_company), k = parseMoney(s.balance_customer);
  return (c === null || k === null) ? null : c - k;
}

function sortShops(rows, mode) {
  const byNum = (getter, dir) => (a, b) => {
    const av = getter(a), bv = getter(b);
    if (av === null && bv === null) return a.shop_code.localeCompare(b.shop_code);
    if (av === null) return 1;
    if (bv === null) return -1;
    return dir === 'desc' ? bv - av : av - bv;
  };
  switch (mode) {
    case 'balance_desc': return rows.sort(byNum(balanceValue, 'desc'));
    case 'balance_asc': return rows.sort(byNum(balanceValue, 'asc'));
    case 'diff_desc': return rows.sort(byNum(s => { const d = differenceValue(s); return d === null ? null : Math.abs(d); }, 'desc'));
    case 'code': return rows.sort((a, b) => a.shop_code.localeCompare(b.shop_code));
    case 'photos_desc': return rows.sort((a, b) => (b.photoCount || 0) - (a.photoCount || 0));
    default: return rows;
  }
}

async function loadData() {
  try {
    allShops = await api('/api/dashboard/shops');
    el('#liveBadge').textContent = `LIVE - ${allShops.length} shops`;
    render();
  } catch (err) {
    el('#liveBadge').textContent = 'Error loading data';
    toast(err.message, 'err');
  }
}

function currentFilters() {
  return {
    van: el('#fVan').value,
    day: el('#fDay').value,
    q: el('#fSearch').value.trim().toLowerCase(),
    sort: el('#fSort').value,
  };
}

function render() {
  const { van, day, q, sort } = currentFilters();
  let rows = allShops.filter(s => {
    if (van && String(s.van_id) !== van) return false;
    if (day && String(s.visit_day || '') !== day) return false;
    if (q && !s.shop_code.toLowerCase().includes(q) && !(s.customer_name || '').toLowerCase().includes(q)) return false;
    if (state.onlyMismatches) { const d = differenceValue(s); if (d === null || d === 0) return false; }
    if (state.onlyVerified && !s.verified_at) return false;
    return true;
  });
  rows = sortShops(rows.slice(), sort);

  const banner = el('#filterBanner');
  if (state.onlyMismatches) banner.innerHTML = 'Showing only shops with a ledger mismatch. <a href="#" id="clearSpecialFilter">Clear</a>';
  else if (state.onlyVerified) banner.innerHTML = 'Showing only field-visit verified shops. <a href="#" id="clearSpecialFilter">Clear</a>';
  else banner.innerHTML = '';
  banner.style.display = (state.onlyMismatches || state.onlyVerified) ? 'block' : 'none';
  const clearLink = el('#clearSpecialFilter');
  if (clearLink) clearLink.onclick = (e) => { e.preventDefault(); state.onlyMismatches = false; state.onlyVerified = false; render(); };

  renderStats(rows, van, day);
  renderChart(rows);
  renderTable(rows);
}

function renderStats(rows, van, day) {
  const totalBalance = rows.reduce((s, r) => s + (balanceValue(r) || 0), 0);
  const withBalance = rows.filter(r => balanceValue(r) !== null).length;
  const verified = rows.filter(r => r.verified_at).length;
  const totalPhotos = rows.reduce((s, r) => s + (r.photoCount || 0), 0);
  const mismatches = rows.filter(r => { const d = differenceValue(r); return d !== null && d !== 0; }).length;
  const scope = [van ? `Van ${van}` : null, day ? `Day ${day}` : null].filter(Boolean).join(', ') || 'All Vans / All Days';

  el('#statTiles').innerHTML = `
    <div class="stat-tile"><div class="stat-value">${rows.length}</div><div class="stat-label">Shops (${scope})</div></div>
    <div class="stat-tile gold"><div class="stat-value">${totalBalance.toLocaleString()}</div><div class="stat-label">Total Customer-Ledger Balance (${withBalance} with a value)</div></div>
    <div class="stat-tile" id="tileVerified" style="cursor:pointer"><div class="stat-value">${verified}/${rows.length}</div><div class="stat-label">Field-Visit Verified (click to filter)</div></div>
    <div class="stat-tile"><div class="stat-value">${totalPhotos}</div><div class="stat-label">Photos on Record</div></div>
    <div class="stat-tile" id="tileMismatch" style="cursor:pointer"><div class="stat-value" style="color:${mismatches ? 'var(--danger)' : '#4ADE80'}">${mismatches}</div><div class="stat-label">Ledger Mismatches (click to view)</div></div>
  `;

  el('#tileMismatch').onclick = () => {
    state.onlyMismatches = !state.onlyMismatches;
    state.onlyVerified = false;
    el('#fSort').value = 'diff_desc';
    render();
    el('.table-card').scrollIntoView({ behavior: 'smooth', block: 'start' });
  };
  el('#tileVerified').onclick = () => {
    state.onlyVerified = !state.onlyVerified;
    state.onlyMismatches = false;
    render();
    el('.table-card').scrollIntoView({ behavior: 'smooth', block: 'start' });
  };
}

function renderChart(rows) {
  const top = rows
    .map(s => ({ label: s.shop_code, value: balanceValue(s) }))
    .filter(s => s.value !== null && s.value > 0)
    .sort((a, b) => b.value - a.value)
    .slice(0, 12);
  el('#chartScope').textContent = top.length ? `(top ${top.length} by customer-ledger balance)` : '';
  const chart = el('#chart');
  if (!top.length) { chart.innerHTML = '<div class="chart-empty">No shops with a balance value in this view yet.</div>'; return; }
  const max = Math.max(...top.map(s => s.value));
  chart.innerHTML = top.map(s => `
    <div class="bar-row">
      <div class="bar-label" title="${s.label}">${s.label}</div>
      <div class="bar-track"><div class="bar-fill" style="width:${Math.max(2, (s.value / max) * 100)}%"></div></div>
      <div class="bar-value">${s.value.toLocaleString()}</div>
    </div>
  `).join('');
}

function renderTable(rows) {
  el('#tableCount').textContent = `(${rows.length})`;
  const body = el('#tableBody');
  body.innerHTML = '';
  el('#emptyState').style.display = rows.length ? 'none' : 'block';
  for (const s of rows) {
    const diff = differenceValue(s);
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td>${s.van_name}</td>
      <td>${s.visit_day ? `Day ${s.visit_day}` : '-'}</td>
      <td>${s.shop_code}</td>
      <td>${s.customer_name || '-'}</td>
      <td>${s.balance_company || '-'}</td>
      <td>${s.balance_customer || '-'}</td>
      <td class="${diff === null ? '' : diff === 0 ? 'diff-ok' : 'diff-mismatch'}">${diff === null ? '-' : diff.toLocaleString()}</td>
      <td>${s.photoCount || 0}/8</td>
      <td>${s.verified_at || '-'}</td>
    `;
    tr.onclick = () => openShopModal(s.id);
    body.appendChild(tr);
  }
}

['fVan', 'fDay', 'fSort'].forEach(id => el('#' + id).addEventListener('change', render));
el('#fSearch').addEventListener('input', render);

// ---------------- Shop detail modal (fetched fresh - always current, always
// gets freshly-signed photo URLs even if this page was left open for hours) ----------------
let modalPhotos = [];

async function openShopModal(id) {
  try {
    const shop = await api(`/api/shops/${id}`);
    el('#modalTitle').textContent = shop.shop_code;
    const diff = differenceValue(shop);
    const fields = [
      ['Customer Code', shop.shop_code],
      ['Customer Name', shop.customer_name || '-'],
      ['Van', (allShops.find(s => s.id === shop.id) || {}).van_name || ''],
      ['Day', shop.visit_day ? `Day ${shop.visit_day}` : 'Not set'],
      ['Actual Field Visit Date', shop.verified_at || '-'],
      ['Stock Status', shop.stock_status || '-'],
      ['Balance as per Shah Oil Traders Ledger', shop.balance_company || '-'],
      ['Balance as per Customer Ledger', shop.balance_customer || '-'],
    ];
    let html = fields.map(([label, val]) => `
      <div class="detail-field"><label>${label}</label><div class="val">${val}</div></div>
    `).join('');
    html += `<div class="detail-field diff"><label>Difference</label><div class="val ${diff === null ? '' : diff === 0 ? 'diff-ok' : 'diff-mismatch'}">${diff === null ? '-' : diff.toLocaleString()}</div></div>`;
    html += `<div class="detail-field wide"><label>Remarks</label><div class="val">${shop.notes || '-'}</div></div>`;
    html += `<div class="detail-field"><label>Created</label><div class="val">${shop.created_at ? new Date(shop.created_at).toLocaleString() : '-'}</div></div>`;
    html += `<div class="detail-field"><label>Last Updated</label><div class="val">${shop.updated_at ? new Date(shop.updated_at).toLocaleString() : '-'}</div></div>`;
    el('#modalFields').innerHTML = html;

    modalPhotos = (shop.photos || []).filter(p => p.signed_url);
    const photoGrid = el('#modalPhotos');
    if (!modalPhotos.length) {
      photoGrid.innerHTML = '<div class="no-photos">No photos uploaded for this shop yet.</div>';
    } else {
      photoGrid.innerHTML = modalPhotos.map((p, i) =>
        `<div class="photo-thumb" data-i="${i}"><img src="${p.signed_url}" loading="lazy" /></div>`
      ).join('');
      photoGrid.querySelectorAll('.photo-thumb').forEach(el2 => {
        el2.addEventListener('click', () => openLightbox(parseInt(el2.dataset.i, 10)));
      });
    }

    el('#modalBackdrop').classList.remove('hidden');
  } catch (err) {
    toast(err.message, 'err');
  }
}

el('#modalClose').addEventListener('click', () => el('#modalBackdrop').classList.add('hidden'));
el('#modalBackdrop').addEventListener('click', (e) => { if (e.target.id === 'modalBackdrop') el('#modalBackdrop').classList.add('hidden'); });

// ---------------- Lightbox ----------------
let lbIndex = 0;
function openLightbox(i) {
  lbIndex = i;
  el('#lightbox').classList.remove('hidden');
  showLbPhoto();
}
function showLbPhoto() {
  const p = modalPhotos[lbIndex];
  if (!p) return closeLightbox();
  el('#lbImage').src = p.signed_url;
  el('#lbCounter').textContent = `${lbIndex + 1} / ${modalPhotos.length}`;
  const multi = modalPhotos.length > 1;
  el('#lbPrev').style.display = multi ? '' : 'none';
  el('#lbNext').style.display = multi ? '' : 'none';
}
function stepLb(d) {
  const n = modalPhotos.length;
  if (!n) return;
  lbIndex = (lbIndex + d + n) % n;
  showLbPhoto();
}
function closeLightbox() { el('#lightbox').classList.add('hidden'); el('#lbImage').src = ''; }
el('#lbClose').addEventListener('click', closeLightbox);
el('#lbPrev').addEventListener('click', (e) => { e.stopPropagation(); stepLb(-1); });
el('#lbNext').addEventListener('click', (e) => { e.stopPropagation(); stepLb(1); });
el('#lightbox').addEventListener('click', (e) => { if (e.target.id === 'lightbox') closeLightbox(); });
document.addEventListener('keydown', (e) => {
  if (el('#lightbox').classList.contains('hidden')) return;
  if (e.key === 'Escape') closeLightbox();
  else if (e.key === 'ArrowLeft') stepLb(-1);
  else if (e.key === 'ArrowRight') stepLb(1);
});

loadData();
// Re-fetch periodically so numbers stay accurate if this dashboard is left open
// for a long stretch while field agents keep entering data elsewhere.
setInterval(loadData, 300000);
</script>
</body>
</html>
