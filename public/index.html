<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Van Shop Verification</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
<div id="toast" class="toast"></div>

<header class="topbar">
  <h1>Van Shop Verification</h1>
  <div class="topbar-actions">
    <span id="statusPill" class="status-pill">Ready</span>
    <button id="backupNowBtn" class="btn ghost">Backup now</button>
    <button id="backupPhotosBtn" class="btn ghost">Download with Photos</button>
    <button id="dashboardBtn" class="btn ghost">Dashboard</button>
  </div>
</header>

<main id="app">
  <!-- VAN LIST VIEW -->
  <section id="vanView" class="view">
    <h2>Select a Van</h2>
    <div id="vanGrid" class="van-grid"></div>
  </section>

  <!-- DASHBOARD VIEW: all shops across all vans -->
  <section id="dashboardView" class="view hidden">
    <div class="view-header">
      <button class="btn back" data-action="back-to-vans-from-dashboard">&larr; Vans</button>
      <h2>All Shops</h2>
      <div class="spacer"></div>
      <select id="dashboardVanFilter">
        <option value="">All Vans</option>
        <option value="1">Van 1</option>
        <option value="2">Van 2</option>
        <option value="3">Van 3</option>
        <option value="4">Van 4</option>
        <option value="5">Van 5</option>
      </select>
      <select id="dashboardDayFilter">
        <option value="">All Days</option>
        <option value="1">Day 1</option>
        <option value="2">Day 2</option>
        <option value="3">Day 3</option>
        <option value="4">Day 4</option>
        <option value="5">Day 5</option>
        <option value="6">Day 6</option>
        <option value="7">Day 7</option>
      </select>
      <select id="dashboardSort">
        <option value="default">Sort: Van &amp; Day</option>
        <option value="balance_desc">Balance: High &rarr; Low</option>
        <option value="balance_asc">Balance: Low &rarr; High</option>
        <option value="code">Shop Code A&ndash;Z</option>
        <option value="photos_desc">Most Photos First</option>
      </select>
      <input id="dashboardSearch" type="search" placeholder="Search shop code or customer..." />
    </div>

    <div id="dashboardStats" class="stat-tiles"></div>

    <div class="chart-card">
      <h3>Balance by Shop <span id="chartScopeLabel" class="muted"></span></h3>
      <div id="dashboardChart" class="bar-chart"></div>
    </div>

    <div id="dashboardTableWrap" class="dashboard-table-wrap">
      <table class="dashboard-table">
        <thead>
          <tr>
            <th>Van</th><th>Day</th><th>Shop Code</th><th>Customer</th>
            <th>Balance</th><th>Photos</th><th>Verified</th>
          </tr>
        </thead>
        <tbody id="dashboardTableBody"></tbody>
      </table>
    </div>
  </section>

  <!-- SHOP LIST VIEW -->
  <section id="shopListView" class="view hidden">
    <div class="view-header">
      <button class="btn back" data-action="back-to-vans">&larr; Vans</button>
      <h2 id="shopListTitle">Van</h2>
      <div class="spacer"></div>
      <input id="shopSearch" type="search" placeholder="Search shop code or customer..." />
    </div>

    <div class="add-row">
      <input id="newShopCode" placeholder="Shop code (e.g. SHOP-091)" />
      <input id="newShopCustomer" placeholder="Customer name (optional)" />
      <button class="btn primary" data-action="add-shop">+ Add Shop</button>
      <span class="or">or</span>
      <input id="bulkCount" type="number" min="1" max="200" placeholder="Bulk count e.g. 90" style="width:110px" />
      <button class="btn" data-action="bulk-add">Bulk Create Empty Slots</button>
    </div>

    <div id="shopGrid" class="shop-grid"></div>
  </section>

  <!-- SHOP DETAIL VIEW -->
  <section id="shopDetailView" class="view hidden">
    <div class="view-header">
      <button class="btn back" data-action="back-to-shops">&larr; Shops</button>
      <h2 id="shopDetailTitle">Shop</h2>
      <div class="spacer"></div>
      <span id="saveState" class="save-state"></span>
    </div>

    <div class="detail-grid">
      <form id="shopForm" class="shop-form">
        <label>Shop Code
          <input name="shop_code" required />
        </label>
        <label>Customer Name
          <input name="customer_name" />
        </label>
        <label>Day
          <select name="visit_day">
            <option value="">Not set</option>
            <option value="1">Day 1</option>
            <option value="2">Day 2</option>
            <option value="3">Day 3</option>
            <option value="4">Day 4</option>
            <option value="5">Day 5</option>
            <option value="6">Day 6</option>
            <option value="7">Day 7</option>
          </select>
        </label>
        <label>Stock Status
          <textarea name="stock_status" rows="2" placeholder="What stock was found..."></textarea>
        </label>
        <label>Balance Amount
          <input name="balance_amount" placeholder="e.g. 1250" />
        </label>
        <label>Notes
          <textarea name="notes" rows="3"></textarea>
        </label>
        <label>Verified Date
          <input type="date" name="verified_at" />
        </label>
        <div class="form-actions">
          <button type="submit" class="btn primary">Save Shop Data</button>
          <button type="button" class="btn danger" data-action="delete-shop">Delete Shop</button>
        </div>
      </form>

      <div class="photos-panel">
        <h3>Photos <span id="photoCount" class="muted"></span></h3>
        <p class="hint">Up to 8 photos per shop (stock, balance, shopkeeper, shop front, etc.)</p>
        <input id="photoInput" type="file" accept="image/*" multiple />
        <button class="btn primary" data-action="upload-photos">Upload Selected Photos</button>
        <div id="photoGrid" class="photo-grid"></div>
      </div>
    </div>
  </section>
</main>

<!-- FULLSCREEN PHOTO VIEWER -->
<div id="lightbox" class="lightbox hidden">
  <button id="lbClose" class="lb-close" title="Close (Esc)">&times;</button>
  <button id="lbPrev" class="lb-nav lb-prev" title="Previous (&larr;)">&#8249;</button>
  <img id="lbImage" class="lb-image" alt="Shop photo" />
  <button id="lbNext" class="lb-nav lb-next" title="Next (&rarr;)">&#8250;</button>
  <div id="lbCounter" class="lb-counter"></div>
</div>

<script src="app.js"></script>
</body>
</html>
